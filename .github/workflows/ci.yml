name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  docker:
    name: docker build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sop-agent .
      - name: Smoke test /healthz
        run: |
          docker run -d --name sop-agent -p 8000:8000 -e LLM_API_KEY=dummy sop-agent
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then
              echo
              echo "healthz OK after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "healthz did not respond within 30s"
          docker logs sop-agent
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f sop-agent || true

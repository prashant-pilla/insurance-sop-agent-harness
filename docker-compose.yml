services:
  app:
    build:
      context: .
    env_file: .env
    ports:
      # Host port; override with APP_PORT=8010 when 8000 is busy. The container always listens on 8000.
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Optional: keep per-session JSONL traces on the host (only written when TRACE_ENABLED=true).
      - ./traces:/srv/traces
